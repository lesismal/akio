[package]
name = "only-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace: nightly-only, never built by the main workspace (see the root `exclude`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
only-http = { path = "../crates/only-http", features = ["fuzzing"] }
only-ws = { path = "../crates/only-ws", features = ["fuzzing"] }
only-arpc = { path = "../crates/only-arpc", features = ["fuzzing"] }
only-grpc = { path = "../crates/only-grpc", features = ["fuzzing"] }
only-socks = { path = "../crates/only-socks", features = ["fuzzing"] }
only-mux = { path = "../crates/only-mux", features = ["fuzzing"] }
only-kcp = { path = "../crates/only-kcp", features = ["fuzzing"] }
only-h3 = { path = "../crates/only-h3", features = ["fuzzing"] }
only-quic = { path = "../crates/only-quic", features = ["fuzzing"] }
only-ebpf = { path = "../crates/only-ebpf", features = ["fuzzing"] }
only-turn = { path = "../crates/only-turn", features = ["fuzzing"] }
only-webrtc = { path = "../crates/only-webrtc", features = ["fuzzing"] }
only-media = { path = "../crates/only-media", features = ["fuzzing"] }
only-bittorrent = { path = "../crates/only-bittorrent", features = ["fuzzing"] }
only-crypto = { path = "../crates/only-crypto" }
# Reference implementations for the only-crypto differential targets (crypto_*): the crates
# only-crypto replaced in the libraries stay here as fuzz-only dependencies.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
crc32fast = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
# Reference for the public-key differential target `crypto_sig_verify`.
ring = "0.17"
only-x509 = { path = "../crates/only-x509", features = ["fuzzing"] }
only-dtls = { path = "../crates/only-dtls", features = ["fuzzing"] }
only-ice = { path = "../crates/only-ice", features = ["fuzzing"] }
only-sctp = { path = "../crates/only-sctp", features = ["fuzzing"] }
only-srtp = { path = "../crates/only-srtp", features = ["fuzzing"] }
only-rtp = { path = "../crates/only-rtp", features = ["fuzzing"] }
only-tls = { path = "../crates/only-tls", features = ["fuzzing"] }
only-protobuf = { path = "../crates/only-protobuf" }
# Generated test messages and the prost mirror for the differential target `protobuf_diff`.
protobuf-test = { path = "../tools/protobuf-test" }
prost = "0.13"
# Reference implementations for the differential targets (the libraries no longer use them).
httparse = "1"
loona-hpack = "0.4"
regex = "1"
only-dpdk = { path = "../crates/only-dpdk", features = ["fuzzing"] }
only-deflate = { path = "../crates/only-deflate", features = ["fuzzing"] }
# Differential oracle for the deflate targets only (zlib-rs).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[profile.release]
debug = 1

[[bin]]
name = "http1_request"
path = "fuzz_targets/http1_request.rs"
test = false
doc = false
bench = false

