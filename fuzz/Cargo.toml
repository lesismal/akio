[package]
name = "akio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace: nightly-only, never built by the main workspace (see the root `exclude`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
akio-http = { path = "../crates/akio-http", features = ["fuzzing"] }
akio-ws = { path = "../crates/akio-ws", features = ["fuzzing"] }
akio-arpc = { path = "../crates/akio-arpc", features = ["fuzzing"] }
akio-grpc = { path = "../crates/akio-grpc", features = ["fuzzing"] }
akio-socks = { path = "../crates/akio-socks", features = ["fuzzing"] }
akio-mux = { path = "../crates/akio-mux", features = ["fuzzing"] }
akio-kcp = { path = "../crates/akio-kcp", features = ["fuzzing"] }
akio-h3 = { path = "../crates/akio-h3", features = ["fuzzing"] }
akio-quic = { path = "../crates/akio-quic", features = ["fuzzing"] }
akio-ebpf = { path = "../crates/akio-ebpf", features = ["fuzzing"] }
akio-turn = { path = "../crates/akio-turn", features = ["fuzzing"] }
akio-webrtc = { path = "../crates/akio-webrtc", features = ["fuzzing"] }
akio-media = { path = "../crates/akio-media", features = ["fuzzing"] }
akio-bittorrent = { path = "../crates/akio-bittorrent", features = ["fuzzing"] }
akio-crypto = { path = "../crates/akio-crypto" }
akio-log = { path = "../crates/akio-log" }
akio-regex = { path = "../crates/akio-regex", features = ["fuzzing"] }
akio-export = { path = "../crates/akio-export", features = ["fuzzing"] }
# Reference JSON parser for the OTLP/JSON target (export_otlp).
serde_json = "1"
# Reference implementations for the akio-crypto differential targets (crypto_*): the crates
# akio-crypto replaced in the libraries stay here as fuzz-only dependencies.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
crc32fast = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
# Reference for the public-key differential target `crypto_sig_verify`.
ring = "0.17"
akio-x509 = { path = "../crates/akio-x509", features = ["fuzzing"] }
akio-dtls = { path = "../crates/akio-dtls", features = ["fuzzing"] }
akio-ice = { path = "../crates/akio-ice", features = ["fuzzing"] }
akio-sctp = { path = "../crates/akio-sctp", features = ["fuzzing"] }
akio-srtp = { path = "../crates/akio-srtp", features = ["fuzzing"] }
akio-rtp = { path = "../crates/akio-rtp", features = ["fuzzing"] }
akio-tls = { path = "../crates/akio-tls", features = ["fuzzing"] }
akio-protobuf = { path = "../crates/akio-protobuf" }
# Generated test messages and the prost mirror for the differential target `protobuf_diff`.
protobuf-test = { path = "../tools/protobuf-test" }
prost = "0.13"
# Reference implementations for the differential targets (the libraries no longer use them).
httparse = "1"
loona-hpack = "0.4"
regex = "1"
akio-dpdk = { path = "../crates/akio-dpdk", features = ["fuzzing"] }
akio-sys = { path = "../crates/akio-sys" }
akio-deflate = { path = "../crates/akio-deflate", features = ["fuzzing"] }
# Differential oracle for the deflate targets only (zlib-rs).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
akio-brotli = { path = "../crates/akio-brotli", features = ["fuzzing"] }
akio-zstd = { path = "../crates/akio-zstd", features = ["fuzzing"] }
akio-wasm = { path = "../crates/akio-wasm", features = ["fuzzing"] }
# akio-wasm's execution targets (ADR-125, section 6): valid modules generated from the fuzzer's
# bytes, and wasmi as the differential reference for `wasm_diff`.
wasm-smith = "0.263"
# The portable loop dispatch: the default tail-call dispatch recurses natively under ASan.
# Deterministic: arithmetic NaN results canonical, as akio-wasm's, so float bits compare exactly.
wasmi = { version = "2", features = ["portable-dispatch", "deterministic"] }
# Differential oracles for the brotli and zstd targets only (Google's brotli in Rust, libzstd).
brotli-decompressor = "5"
zstd = { version = "0.13", default-features = false }

[profile.release]
debug = 1

