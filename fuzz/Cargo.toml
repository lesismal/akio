[package]
name = "flash-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace: nightly-only, never built by the main workspace (see the root `exclude`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
flash-http = { path = "../crates/flash-http", features = ["fuzzing"] }
flash-ws = { path = "../crates/flash-ws", features = ["fuzzing"] }
flash-arpc = { path = "../crates/flash-arpc", features = ["fuzzing"] }
flash-grpc = { path = "../crates/flash-grpc", features = ["fuzzing"] }
flash-socks = { path = "../crates/flash-socks", features = ["fuzzing"] }
flash-mux = { path = "../crates/flash-mux", features = ["fuzzing"] }
flash-kcp = { path = "../crates/flash-kcp", features = ["fuzzing"] }
flash-h3 = { path = "../crates/flash-h3", features = ["fuzzing"] }
flash-ebpf = { path = "../crates/flash-ebpf", features = ["fuzzing"] }
flash-media = { path = "../crates/flash-media", features = ["fuzzing"] }

[profile.release]
debug = 1

[[bin]]
name = "http1_request"
path = "fuzz_targets/http1_request.rs"
test = false
doc = false
bench = false

