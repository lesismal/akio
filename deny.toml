# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run: `cargo deny check` (advisories, licenses, bans, sources). See docs/unsafe-review.md and
# SECURITY.md. Every exception below carries the reason it is accepted.

[graph]
# Check every platform only supports, and every feature (optional deps such as prost and
# echo-bench's `tls` included).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec advisory database. Vulnerabilities, unsound and yanked crates fail the check;
# "unmaintained" fails for any crate in the graph (workspace members are never flagged).
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = [
    # time 0.3.45: stack exhaustion when parsing hostile RFC 2822 input. Reached only through
    # rcgen (a dev-dependency generating test certificates; no RFC 2822 parsing). The fix,
    # time 0.3.47, needs Rust 1.88 and would break the MSRV (1.85) check of the test targets.
    # Drop this once the MSRV reaches 1.88 or rcgen no longer pulls time.
    { id = "RUSTSEC-2026-0009", reason = "dev-only via rcgen; fix needs Rust 1.88 > MSRV" },
    # crypto-bigint 0.5.5: some operations meant to be constant time may branch on secrets,
    # depending on compiler and CPU. Reached only through p256/p384 0.13 (elliptic-curve 0.13),
    # the dev-dependencies only-crypto's public-key cross-checks and benchmarks compare against;
    # no library links it since the in-house WebRTC stack replaced str0m / dimpl. The fix is
    # crypto-bigint 0.7.6, i.e. elliptic-curve 0.14: drop this when the cross-checks move to
    # p256/p384 0.14.
    { id = "RUSTSEC-2026-0387", reason = "dev-only via p256/p384 0.13 cross-checks in only-crypto" },
]

[licenses]
# The workspace is MIT; these licenses are all permissive and MIT-compatible for distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace crates are not published yet (version 0.0.0); they inherit MIT from the workspace.
ignore = true

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other through [workspace.dependencies] (path + version).
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Accepted duplicates, all pulled in by upstream crates on different major versions (none is a
# direct dependency of two workspace crates at different versions). Revisit on upgrades.
skip = [
    # quinn-proto 0.11 -> rand 0.10 -> getrandom 0.4 / rand_core 0.10 / cpufeatures 0.3, while
    # ring 0.17 (rustls) and RustCrypto 0.10-era crates (aes-gcm, sha1, pbkdf2) stay on
    # getrandom 0.2 / rand_core 0.6 / cpufeatures 0.2.
    { crate = "getrandom@0.2", reason = "ring 0.17 and RustCrypto crypto-common 0.1" },
    { crate = "rand_core@0.6", reason = "RustCrypto crypto-common 0.1 (only-kcp ciphers)" },
    { crate = "cpufeatures@0.2", reason = "RustCrypto 0.10-era crates; quinn-proto's chacha20 uses 0.3" },
    # chacha20poly1305 0.10 (an only-crypto dev-dependency) uses chacha20 0.9, quinn-proto 0.10.
    { crate = "chacha20@0.9", reason = "chacha20poly1305 0.10 (only-crypto cross-checks)" },
    # Proc-macro build-time only: prost-derive 0.13 (tools/protobuf-test) on syn 2,
    # thiserror-impl 2 on syn 3.
    { crate = "syn@2", reason = "prost-derive 0.13 (build time only)" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
