name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: cargo test
        # One test at a time, so a hang shows which test it is; the step timeout keeps the log.
        timeout-minutes: 8
        run: cargo test --workspace -- --test-threads=1
      - name: Tests on the io_uring backend (Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p flash
        env:
          FLASH_TEST_BACKEND: uring

  miri:
    # Pure-Rust crates only; crates with OS syscalls are excluded.
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins stable; override it for this job.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p flash-timer -p flash-buf -p flash-core

  loom:
    # Model-checks the cork/send/close protocols of flash-core::conn (see loom_tests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: RUSTFLAGS="--cfg loom" cargo test -p flash-core --lib --release -- loom

  autobahn:
    # RFC 6455 / RFC 7692 conformance: the Autobahn|Testsuite fuzzing client against ws-echo.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flash-http --example ws-echo
      - name: Autobahn (core protocol)
        run: tools/autobahn/run.sh base
      - name: Autobahn (permessage-deflate)
        run: tools/autobahn/run.sh pmd
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: /tmp/autobahn-*/

  h2spec:
    # RFC 9113 / 7541 conformance of the HTTP/2 server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flash-http --example h2-server
      - run: tools/h2spec/run.sh
