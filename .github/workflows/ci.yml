name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Tests on the io_uring backend (Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p flash
        env:
          FLASH_TEST_BACKEND: uring

  miri:
    # Pure-Rust crates only; crates with OS syscalls are excluded.
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins stable; override it for this job.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p flash-timer -p flash-buf -p flash-core

  loom:
    # Model-checks the cork/send/close protocols of flash-core::conn (see loom_tests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: RUSTFLAGS="--cfg loom" cargo test -p flash-core --lib --release -- loom
