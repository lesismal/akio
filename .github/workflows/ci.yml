name: CI

# Layout
#   Gate (every push and PR):  lint, docs, book, test-linux (epoll + io_uring, x86_64 + arm64),
#                              msrv, features, miri, loom, coverage, autobahn, h2spec,
#                              supply-chain (cargo-deny, cargo-audit, unsafe inventory)
#   Best effort:               test-macos (macOS runners are often not scheduled for capacity;
#                              a job that never starts is not a code failure)
#   Heavy (push to main, nightly schedule, manual run, or a PR labelled `full-ci`):
#                              interop (Go peers: arpc, grpc, kcp, h3), fuzz (all targets, 5 min
#                              each), sanitizers (ASan + TSan on the core and backend tests)
#   Deploy (push to main):     book-deploy (GitHub Pages)
#   ci-ok:                     one status to require in branch protection.
#
# Adding a job: copy the closest job, keep `timeout-minutes`, use Swatinem/rust-cache with its
# own `shared-key`, and add the job id to `ci-ok.needs`. For a heavy job, put
#   if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
# on it (and do not list it in `ci-ok.needs`, or list it and let ci-ok accept `skipped`).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *" # nightly: the heavy jobs, and a fresh cache
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # New pushes to a PR cancel its running checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  docs:
    # Broken intra-doc links, unclosed HTML in docs, etc.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features

  book:
    # The English and Chinese guides: every included snippet exists and compiles, both books
    # build. On push to main the result is deployed to GitHub Pages by book-deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: book
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache mdBook
        id: mdbook-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.4.52-${{ runner.os }}-${{ runner.arch }}
      - name: Install mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --locked --version 0.4.52
      - run: book/build.sh
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  book-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  test-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        backend: [epoll, uring]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.backend == 'epoll' }}
      - name: Tests (epoll), whole workspace
        if: matrix.backend == 'epoll'
        # One test at a time, so a hang shows which test it is; the step timeout keeps the log.
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1
      - name: Tests (io_uring), crates that honour FLASH_TEST_BACKEND
        if: matrix.backend == 'uring'
        timeout-minutes: 15
        env:
          FLASH_TEST_BACKEND: uring
        run: cargo test -p flash -p flash-http -p flash-ws -- --test-threads=1

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets
      - name: Tests (kqueue)
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the MSRV
        # rust-toolchain.toml pins `stable`; this job overrides it.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-targets

  features:
    # Every feature combination of the crates that have features, and the tests without the
    # default features.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - name: flash-http without default features
        timeout-minutes: 10
        run: cargo test -p flash-http --no-default-features -- --test-threads=1

  miri:
    # Pure-Rust code only (Miri cannot run syscalls): the core crates, the protocol crates'
    # unit tests and the syscall-free io_uring buffer-ring tests. Skipped: flash-grpc's gzip
    # test (zlib-rs 0.6.8 violates Stacked/Tree Borrows in its Deflate drop, see
    # docs/unsafe-review.md) and tests too slow under Miri (deflate round trips, exhaustive
    # split loops, flash-ebpf's interpreter sweeps).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # rust-toolchain.toml pins stable; override it for this job.
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri test -p flash-timer -p flash-buf -p flash-core
      # `fuzzing::` tests replay the fuzz corpora: minutes per crate under Miri, and the fuzz
      # job already runs those inputs natively.
      - run: >-
          cargo miri test --lib -p flash-pool -p flash-http -p flash-mux
          -p flash-arpc -p flash-h3 -p flash-kcp -- --skip fuzzing::
      - name: flash-socks (its test connection leaves a helper thread running at exit)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks
        run: "cargo miri test -p flash-socks --lib -- --skip fuzzing::"
      - run: "cargo miri test -p flash-grpc --lib -- --skip framing_and_gzip --skip fuzzing::"
      - run: >-
          cargo miri test -p flash-ws --lib --
          protocol:: session:: client:: deflate::tests::negotiation deflate::tests::client_offer
          --skip messages_survive_any_split --skip fuzzing::
      - name: io_uring buffer ring (kernel-shared memory, no syscalls)
        run: cargo miri test -p flash-uring --lib -- buf_ring kernel_buf

  loom:
    # Model-checks the cork/send/close protocols of flash-core::conn (see loom_tests).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p flash-core --lib --release -- loom
        env:
          RUSTFLAGS: --cfg loom

  coverage:
    # Line coverage, epoll and io_uring runs merged. The report is in the job summary and log,
    # lcov.info is an artifact, and it goes to Codecov when a CODECOV_TOKEN secret exists.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Coverage (both backends)
        timeout-minutes: 30
        run: tools/coverage/run.sh
      - name: Summary
        run: |
          python3 tools/coverage/summary.py target/coverage/coverage.json --files 15 \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.md
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  autobahn:
    # RFC 6455 / RFC 7692 conformance: the Autobahn|Testsuite fuzzing client against ws-echo,
    # and the fuzzing server against our client.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          cargo build --release -p flash-http --example ws-echo
          -p flash-ws --example ws-autobahn-client
      - name: Autobahn server (core protocol)
        run: tools/autobahn/run.sh base
      - name: Autobahn server (permessage-deflate)
        run: tools/autobahn/run.sh pmd
      - name: Autobahn client
        run: tools/autobahn/run.sh client
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: /tmp/autobahn-*/

  h2spec:
    # RFC 9113 / 7541 conformance of the HTTP/2 server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: false
      - run: cargo build --release -p flash-http --example h2-server
      - run: tools/h2spec/run.sh

  interop:
    # Against Go peers: fib's arpc, grpc-go, kcp-go, quic-go + fib's HTTP/3. The arpc and h3
    # suites build against the fib checkout next to flash (../../../../fib from each suite).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        suite: [arpc, grpc, kcp, h3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: flash
      - uses: actions/checkout@v4
        with:
          repository: lesismal/fib
          path: fib
      - uses: actions/setup-go@v5
        with:
          go-version-file: flash/tools/interop/${{ matrix.suite }}/go.mod
          cache-dependency-path: flash/tools/interop/${{ matrix.suite }}/go.*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flash
          shared-key: interop-${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Interop (${{ matrix.suite }})
        run: flash/tools/interop/${{ matrix.suite }}/run.sh

  fuzz:
    # Every cargo-fuzz target for 5 minutes, all CPUs. Fails if any target left a crash, leak or
    # timeout input in fuzz/artifacts; artifacts and logs are kept either way.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Built from source: the prebuilt binary is a static musl build, and cargo-fuzz then
      # targets musl (no sanitizer support, no std installed for it).
      - run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fuzz all targets
        env:
          RUSTFLAGS: "" # cargo-fuzz sets its own; warnings are the lint job's business
        run: fuzz/run-all.sh 300 "$(nproc)" | tee fuzz-summary.txt
      - name: No crashes, every target ran
        run: |
          shopt -s nullglob
          found=(fuzz/artifacts/*/*)
          if [ ${#found[@]} -gt 0 ]; then
            printf 'fuzz artifact: %s\n' "${found[@]}"
            exit 1
          fi
          # A target that did not build or start reports a non-zero rc without an artifact.
          if grep -v ' rc=0 ' fuzz-summary.txt; then exit 1; fi
      - name: Keep artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz
          path: |
            fuzz/artifacts/
            fuzz/logs/
          if-no-files-found: ignore

  supply-chain:
    # RustSec advisories, licenses, duplicate versions and sources (deny.toml), cargo-audit
    # (.cargo/audit.toml), and the `SAFETY:` comment check of every unsafe site on all
    # platforms (clippy only sees the host's cfg).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit -D warnings
      - run: python3 tools/unsafe-inventory.py --check

  sanitizers:
    # AddressSanitizer and ThreadSanitizer over the core, syscall and backend tests (epoll and
    # io_uring), where Miri cannot go.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: -D warnings -Zsanitizer=${{ matrix.san }}
      RUSTDOCFLAGS: -Zsanitizer=${{ matrix.san }}
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sanitizer-${{ matrix.san }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Core and syscall crates (epoll)
        timeout-minutes: 25
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p flash-core -p flash-sys -p flash-epoll -p flash-buf -p flash-pool -p flash-timer
          --lib --tests -- --test-threads=1
      - name: io_uring backend
        timeout-minutes: 25
        env:
          FLASH_TEST_BACKEND: uring
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p flash-uring -p flash --lib --tests -- --test-threads=1

  ci-ok:
    # The single required check. Fails if any gate job failed or was cancelled.
    if: always()
    needs: [lint, docs, book, test-linux, msrv, features, miri, loom, coverage, autobahn, h2spec, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gate jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all gate jobs passed"
