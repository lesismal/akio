name: CI

# When it runs (decided by the user, 2026-11-16): NOT on ordinary commits, pushes or pull
# requests. Only when a GitHub release marked "pre-release" is published, or by hand
# (Actions -> CI -> "Run workflow"). Day-to-day verification is local: macOS, Linux arm64 in
# Docker, and natively on x86_64 Linux (docs/DEV-PLAN.md, section 4).
#
# Layout (every job runs on a pre-release)
#   Gate:          lint, docs, book, test-linux (epoll + io_uring, x86_64 + arm64), msrv,
#                  features, miri, loom, coverage, autobahn, h2spec, supply-chain (cargo-deny,
#                  cargo-audit, unsafe inventory), public-api (API snapshots,
#                  docs/api-stability.md), semver-checks (skipped until 1.0.0 is on crates.io)
#   Best effort:   test-macos (macOS runners are often not scheduled for capacity; a job that
#                  never starts is not a code failure)
#   Heavy:         interop (Go peers: arpc, grpc, kcp, h3, webrtc + coturn; libtorrent and aria2
#                  for BitTorrent), fuzz (all targets, 5 min each), sanitizers (ASan + TSan on
#                  the workspace tests, epoll and io_uring), dpdk (only-dpdk with libdpdk:
#                  net_tap / TAP)
#   Informational (`continue-on-error`, not in ci-ok):
#                  ct-dudect (statistical timing test of only-crypto's secret-dependent paths,
#                  t-values kept as an artifact; docs/constant-time.md)
#   Deploy:        not here: .github/workflows/pages.yml builds and deploys the site (books +
#                  rustdoc) to GitHub Pages on a release or by hand
#   ci-ok:         one status to look at.
#
# Adding a job: copy the closest job, keep `timeout-minutes`, use Swatinem/rust-cache with its
# own `shared-key`, and add the job id to `ci-ok.needs`.

on:
  # Only pre-releases (a release published with "Set as a pre-release" checked) and manual
  # runs. Pushes, pull requests and schedules deliberately do not trigger CI.
  release:
    types: [prereleased]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  docs:
    # Broken intra-doc links, unclosed HTML in docs, etc.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: true
      - run: cargo doc --workspace --no-deps --all-features

  book:
    # The English and Chinese guides: every included snippet exists and compiles, both books
    # build. Deployment is .github/workflows/pages.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: book
          save-if: true
      - name: Cache mdBook
        id: mdbook-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.4.52-${{ runner.os }}-${{ runner.arch }}
      - name: Install mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --locked --version 0.4.52
      - run: book/build.sh

  test-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        backend: [epoll, uring]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          save-if: ${{ matrix.backend == 'epoll' }}
      - name: Tests (epoll), whole workspace
        if: matrix.backend == 'epoll'
        # One test at a time, so a hang shows which test it is; the step timeout keeps the log.
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1
      - name: Tests (io_uring), crates that honour ONLY_TEST_BACKEND
        if: matrix.backend == 'uring'
        timeout-minutes: 15
        env:
          ONLY_TEST_BACKEND: uring
        run: cargo test -p only -p only-http -p only-ws -- --test-threads=1

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: true
      - run: cargo clippy --workspace --all-targets
      - name: Tests (kqueue)
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: true
      - name: cargo check on the MSRV
        # rust-toolchain.toml pins `stable`; this job overrides it.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-targets

  features:
    # Every feature combination of the crates that have features, and the tests without the
    # default features.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          save-if: true
      # only-log's 12 compile-time level features would multiply the powerset by 4096: they
      # are left out of it and covered by the static_level test below.
      - run: >-
          cargo hack check --workspace --feature-powerset --no-dev-deps
          --exclude-features max_level_off,max_level_error,max_level_warn,max_level_info,max_level_debug,max_level_trace,release_max_level_off,release_max_level_error,release_max_level_warn,release_max_level_info,release_max_level_debug,release_max_level_trace
      - name: only-log compile-time level caps
        run: |
          cargo test -p only-log --features max_level_info --test static_level
          cargo test -p only-log --release --features max_level_info,release_max_level_warn --test static_level
      - name: only-http without default features
        timeout-minutes: 10
        run: cargo test -p only-http --no-default-features -- --test-threads=1

  miri:
    # Pure-Rust code only (Miri cannot run syscalls): the core crates, only-deflate, the
    # protocol crates' unit tests and the syscall-free io_uring buffer-ring tests. Skipped: tests
    # too slow under Miri (only-ws's large deflate round trips, exhaustive split loops,
    # only-ebpf's interpreter sweeps).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # rust-toolchain.toml pins stable; override it for this job.
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri test -p only-timer -p only-buf -p only-core -p only-protobuf -p only-log -p only-regex
      # `fuzzing::` tests replay the fuzz corpora: minutes per crate under Miri, and the fuzz
      # job already runs those inputs natively.
      - run: >-
          cargo miri test --lib -p only-pool -p only-http -p only-mux
          -p only-arpc -p only-h3 -p only-kcp -- --skip fuzzing::
      - name: only-socks (its test connection leaves a helper thread running at exit)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks
        run: "cargo miri test -p only-socks --lib -- --skip fuzzing::"
      - run: "cargo miri test -p only-deflate --lib -- --skip fuzzing::"
      - run: "cargo miri test -p only-grpc --lib -- --skip fuzzing::"
      - run: >-
          cargo miri test -p only-ws --lib --
          protocol:: session:: client:: deflate::tests::negotiation deflate::tests::client_offer
          deflate::tests::roundtrip_with_and_without_context_takeover
          --skip messages_survive_any_split --skip fuzzing::
      - name: io_uring buffer ring (kernel-shared memory, no syscalls)
        run: cargo miri test -p only-uring --lib -- buf_ring kernel_buf

  loom:
    # Model-checks the cork/send/close protocols of only-core::conn and the reuse of only-buf's
    # receive slabs (see loom_tests).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom
          save-if: true
      - run: cargo test -p only-core -p only-buf --lib --release -- loom
        env:
          RUSTFLAGS: --cfg loom

  coverage:
    # Line coverage, epoll and io_uring runs merged. The report is in the job summary and log,
    # lcov.info is an artifact, and it goes to Codecov when a CODECOV_TOKEN secret exists.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: true
      - name: Coverage (both backends)
        timeout-minutes: 30
        run: tools/coverage/run.sh
      - name: Summary
        run: |
          python3 tools/coverage/summary.py target/coverage/coverage.json --files 15 \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.md
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  autobahn:
    # RFC 6455 / RFC 7692 conformance: the Autobahn|Testsuite fuzzing client against ws-echo,
    # and the fuzzing server against our client.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: true
      - run: >-
          cargo build --release -p only-http --example ws-echo
          -p only-ws --example ws-autobahn-client
      - name: Autobahn server (core protocol)
        run: tools/autobahn/run.sh base
      - name: Autobahn server (permessage-deflate)
        run: tools/autobahn/run.sh pmd
      - name: Autobahn client
        run: tools/autobahn/run.sh client
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: /tmp/autobahn-*/

  h2spec:
    # RFC 9113 / 7541 conformance of the HTTP/2 server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: false
      - run: cargo build --release -p only-http --example h2-server
      - run: tools/h2spec/run.sh

  interop:
    # Against Go peers: fib's arpc, grpc-go, kcp-go, quic-go (raw QUIC echo and HTTP/3) + fib's
    # HTTP/3, pion (WebRTC and TURN, plus coturn's turnutils_uclient in Docker). The arpc and h3
    # suites build against the fib checkout next to this repository (../../../../fib from each
    # suite).
    strategy:
      fail-fast: false
      matrix:
        suite: [arpc, grpc, kcp, h3, quic, webrtc]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: only
      - uses: actions/checkout@v4
        with:
          repository: lesismal/fib
          path: fib
      - uses: actions/setup-go@v5
        with:
          go-version-file: only/tools/interop/${{ matrix.suite }}/go.mod
          cache-dependency-path: only/tools/interop/${{ matrix.suite }}/go.*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: only
          shared-key: interop-${{ matrix.suite }}
          save-if: true
      - name: Interop (${{ matrix.suite }})
        env:
          COTURN: ${{ matrix.suite == 'webrtc' && '1' || '0' }}
        run: only/tools/interop/${{ matrix.suite }}/run.sh

  dpdk:
    # only-dpdk against the distribution's DPDK (tools/dpdk/Dockerfile): clippy with libdpdk
    # linked, the memory-wire tests, and the userspace stack against the kernel stack over DPDK's
    # net_tap PMD (1 and 2 queues), TAP and AF_PACKET (with tc netem loss). Needs NET_ADMIN and
    # /dev/net/tun, so it runs
    # in the job's own container; no hugepages or NIC (--no-huge --no-pci, virtual devices).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: DPDK tests (Docker)
        run: tools/dpdk/test.sh

  interop-bittorrent:
    # only-bittorrent against libtorrent 2.0 and aria2 1.37, in a Debian container (the script
    # starts it and installs both there).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Interop (bittorrent)
        run: tools/interop/bittorrent/run.sh

  fuzz:
    # Every cargo-fuzz target for 5 minutes, all CPUs. Fails if any target left a crash, leak or
    # timeout input in fuzz/artifacts; artifacts and logs are kept either way.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Built from source: the prebuilt binary is a static musl build, and cargo-fuzz then
      # targets musl (no sanitizer support, no std installed for it).
      - run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: true
      - name: Fuzz all targets
        env:
          RUSTFLAGS: "" # cargo-fuzz sets its own; warnings are the lint job's business
        run: fuzz/run-all.sh 300 "$(nproc)" | tee fuzz-summary.txt
      - name: No crashes, every target ran
        run: |
          shopt -s nullglob
          found=(fuzz/artifacts/*/*)
          if [ ${#found[@]} -gt 0 ]; then
            printf 'fuzz artifact: %s\n' "${found[@]}"
            exit 1
          fi
          # A target that did not build or start reports a non-zero rc without an artifact.
          if grep -v ' rc=0 ' fuzz-summary.txt; then exit 1; fi
      - name: Keep artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz
          path: |
            fuzz/artifacts/
            fuzz/logs/
          if-no-files-found: ignore

  ct-dudect:
    # dudect-style timing test of only-crypto's secret-dependent paths (docs/constant-time.md),
    # hardware and portable paths, 15 s per target. Informational, never a gate: a shared runner
    # is noisy (other tenants, frequency scaling), so |t| > 4.5 here is a lead to re-run on a
    # quiet machine, not a verdict. `continue-on-error` keeps a red result from failing the
    # workflow, and the job is deliberately not in `ci-ok.needs`. The t-values are kept as an
    # artifact and the tables go to the job summary.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ct-dudect
          save-if: true
      - run: cargo build --release -p ct-dudect
      - name: Hardware paths
        timeout-minutes: 10
        shell: bash # -eo pipefail: the exit status of ct-dudect, not of tee
        run: target/release/ct-dudect --seconds 15 --json ct-dudect-hw.json | tee ct-dudect-hw.txt
      - name: Portable paths
        if: always()
        timeout-minutes: 8
        shell: bash
        env:
          ONLY_CRYPTO_PORTABLE: "1"
        run: target/release/ct-dudect --seconds 15 --json ct-dudect-portable.json | tee ct-dudect-portable.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in ct-dudect-hw.txt ct-dudect-portable.txt; do
            [ -f "$f" ] || continue
            { echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep the t-values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-dudect
          path: |
            ct-dudect-*.json
            ct-dudect-*.txt
          if-no-files-found: ignore

  supply-chain:
    # RustSec advisories, licenses, duplicate versions and sources (deny.toml), cargo-audit
    # (.cargo/audit.toml), and the `SAFETY:` comment check of every unsafe site on all
    # platforms (clippy only sees the host's cfg).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit -D warnings
      - run: python3 tools/unsafe-inventory.py --check

  public-api:
    # The public API of every published crate must match api/<crate>.txt (docs/api-stability.md).
    # An intended change: run `tools/api/public-api.sh --bless`, commit api/*.txt with a CHANGELOG
    # entry. rustdoc JSON needs nightly; the toolchain and cargo-public-api are pinned so the
    # output only changes when the API does (bump both together and re-bless).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-14
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
          save-if: true
      - run: tools/api/public-api.sh

  semver-checks:
    # Breaking changes against the latest release on crates.io (public-tier crates only, see
    # docs/api-stability.md). Skipped until a 1.x release is published: there is no baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Published baseline?
        id: baseline
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'only-ci (github.com/lesismal/only)' \
            https://crates.io/api/v1/crates/only-core/1.0.0)
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "only-core 1.0.0 on crates.io: HTTP $code"
      - if: steps.baseline.outputs.published == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.baseline.outputs.published == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - if: steps.baseline.outputs.published == 'true'
        run: >-
          cargo semver-checks check-release
          -p only -p only-core -p only-tls -p only-http -p only-ws -p only-mux
          -p only-socks -p only-arpc -p only-grpc -p only-protobuf -p only-protobuf-build
          -p only-kcp -p only-quic -p only-h3
          -p only-ebpf -p only-prefork -p only-bittorrent

  sanitizers:
    # AddressSanitizer (with LeakSanitizer) and ThreadSanitizer over every workspace crate's
    # tests (epoll), then the crates with io_uring tests on the io_uring backend, where Miri
    # cannot go. tools/sanitizers/run.sh is the same script used locally (Docker on arm64,
    # natively on x86_64); its README lists what it sets and why.
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Symbolizer for sanitizer reports
        # Rust's llvm-tools component has no llvm-symbolizer; the runner image's LLVM does.
        run: |
          sym=$(command -v llvm-symbolizer || find /usr/bin -name 'llvm-symbolizer-*' | sort -V | tail -1)
          if [ -z "$sym" ]; then sudo apt-get install -y -qq llvm >/dev/null && sym=$(command -v llvm-symbolizer); fi
          echo "ASAN_SYMBOLIZER_PATH=$sym" >> "$GITHUB_ENV"
          echo "TSAN_SYMBOLIZER_PATH=$sym" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sanitizer-${{ matrix.san }}
          save-if: true
      - name: Workspace (epoll)
        timeout-minutes: 90
        env:
          SAN_LOG_DIR: sanitizer-logs/epoll
        run: tools/sanitizers/run.sh ${{ matrix.san }}
      - name: io_uring backend
        timeout-minutes: 45
        env:
          ONLY_TEST_BACKEND: uring
          SAN_LOG_DIR: sanitizer-logs/uring
        run: >-
          tools/sanitizers/run.sh ${{ matrix.san }}
          only-uring only only-http only-prefork only-socks only-ws
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.san }}
          path: sanitizer-logs/
          if-no-files-found: ignore

  ci-ok:
    # The single required check. Fails if any gate job failed or was cancelled.
    if: always()
    needs: [lint, docs, book, test-linux, msrv, features, miri, loom, coverage, autobahn, h2spec, supply-chain, public-api, semver-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gate jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all gate jobs passed"
