[package]
name = "flash-webrtc"
description = "flash WebRTC: ICE, DTLS-SRTP, SCTP data channels and RTP media (str0m) over flash UDP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/flash-webrtc"
keywords = ["webrtc", "ice", "dtls", "srtp", "sctp"]
categories = ["network-programming", "multimedia"]

[dependencies]
flash = { workspace = true }
flash-turn = { workspace = true }
str0m = { version = "=0.24.1", default-features = false }
dimpl = { version = "0.7.6", default-features = false, features = ["rust-crypto"] }
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
getrandom = "0.2"
log = "0.4"

[lints]
workspace = true
