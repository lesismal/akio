[package]
name = "flash-http"
description = "flash network library: HTTP/1.1 server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash-core = { workspace = true }
flash = { workspace = true }
httparse = "1"
log = { version = "0.4.21", features = ["kv"] }
base64 = "0.22"
loona-hpack = "0.4"
flash-ws = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = { version = "1", optional = true }

[features]
default = ["regex"]
## Regexp route parameters (`/users/{id:[0-9]+}`).
regex = ["dep:regex"]
# Fuzz entry points for `fuzz/` (`flash_http::fuzzing`); not a public API.
fuzzing = ["flash-core/fuzzing"]

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"

[lints]
workspace = true
