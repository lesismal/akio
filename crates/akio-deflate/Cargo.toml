[package]
name = "akio-deflate"
description = "akio internals: DEFLATE, zlib and gzip compression and decompression in pure safe Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/akio-deflate"
keywords = ["deflate", "zlib", "gzip", "compression", "inflate"]
categories = ["compression"]

[dependencies]

[features]
# Fuzz entry points for `fuzz/` (`akio_deflate::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
# Interop tests only: streams of zlib-rs (via flate2) both ways.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true
