[package]
name = "akio-dpdk"
description = "akio kernel-bypass backend (experimental): its own userspace TCP/IP stack over DPDK ports, AF_XDP, TAP, AF_PACKET or in-memory devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/akio-dpdk"
keywords = ["dpdk", "kernel-bypass", "tcp-ip", "network", "userspace"]
categories = ["network-programming"]
links = "akio_dpdk_shim"

[dependencies]
akio-core = { workspace = true }
# AF_XDP sockets and the XDP redirect program (`Device::AfXdp`); everything else is Linux-only
# inside it and reports `Unsupported` elsewhere.
akio-ebpf = { workspace = true }

# TAP and AF_PACKET devices (the userspace TCP/IP stack itself has no dependencies).
[target.'cfg(target_os = "linux")'.dependencies]
akio-sys = { workspace = true }

[build-dependencies]
cc = { version = "1.2", optional = true }
pkg-config = { version = "0.3.30", optional = true }

[features]
# Link DPDK (`pkg-config libdpdk`) and enable `Device::Dpdk`. When libdpdk is not found at build
# time the crate still builds and `Device::Dpdk` fails at runtime with `Unsupported` (set
# AKIO_DPDK_REQUIRE=1 to make that a build error instead).
pmd = ["dep:cc", "dep:pkg-config"]
# Fuzz entry points for `fuzz/` (`akio_dpdk::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
akio = { workspace = true, features = ["dpdk"] }
akio-core = { workspace = true, features = ["fuzzing"] }
akio-kcp = { workspace = true }

[lints]
workspace = true
