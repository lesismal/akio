[package]
name = "flash-ws"
description = "flash network library: WebSocket (RFC 6455)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash-core = { workspace = true }
flash-buf = { workspace = true }
sha1 = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
flash = { workspace = true }
httparse = "1"
getrandom = "0.2"

[features]
# Fuzz entry points for `fuzz/` (`flash_ws::fuzzing`); not a public API.
fuzzing = ["flash-core/fuzzing"]

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }
flash-http = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
