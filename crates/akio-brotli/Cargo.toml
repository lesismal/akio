[package]
name = "akio-brotli"
description = "akio internals: brotli (RFC 7932) compression and decompression in pure safe Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/akio-brotli"
keywords = ["brotli", "compression", "decompression"]
categories = ["compression"]

[dependencies]

[features]
# Fuzz entry points for `fuzz/` (`akio_brotli::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
# Benchmark and tests only: the zlib level 9 baseline for certificate chains.
akio-deflate = { workspace = true }

[lints]
workspace = true

[[example]]
name = "shared-dict-interop"
required-features = ["fuzzing"]
