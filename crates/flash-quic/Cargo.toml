[package]
name = "flash-quic"
description = "flash QUIC: quinn-proto driven over flash UDP sockets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flash-quic"
keywords = ["quic", "udp", "network", "quinn"]
categories = ["network-programming"]

[dependencies]
flash = { workspace = true }
flash-core = { workspace = true }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
bytes = "1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
