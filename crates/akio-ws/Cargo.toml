[package]
name = "akio-ws"
description = "akio WebSocket (RFC 6455) server sessions and client, with permessage-deflate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/akio-ws"
keywords = ["websocket", "ws", "network", "server", "client"]
categories = ["network-programming", "web-programming::websocket"]

[dependencies]
akio-core = { workspace = true }
akio-buf = { workspace = true }
akio-crypto = { workspace = true }
akio-deflate = { workspace = true }
akio = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`akio_ws::fuzzing`); not a public API.
fuzzing = ["akio-core/fuzzing"]

[dev-dependencies]
akio-core = { workspace = true, features = ["fuzzing"] }
akio-http = { workspace = true }
akio-x509 = { workspace = true }

[lints]
workspace = true
