[package]
name = "only-core"
description = "only core: Conn, Handler, Acceptor, Config, telemetry and the backend-facing traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-core"
keywords = ["network", "event-loop", "tcp", "udp", "server"]
categories = ["network-programming"]

[dependencies]
only-buf = { workspace = true }
only-pool = { workspace = true }
only-log = { workspace = true }

[target.'cfg(unix)'.dependencies]
only-sys = { workspace = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[features]
# Detached connections for the fuzz targets (`fuzz/`); not a public API.
fuzzing = []
# Bridge to the `log` crate (only-log's `log` feature): records go to `log`'s logger while no
# only-log logger is installed. Outside the semver promise (docs/api-stability.md).
log = ["only-log/log"]

[lints]
workspace = true
