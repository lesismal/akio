[package]
name = "only-tls"
description = "only TLS: TLS 1.3 and 1.2 implemented in Rust without third-party dependencies, as a transport layer under only connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/only-tls"
keywords = ["tls", "network", "server", "client", "tls13"]
categories = ["network-programming", "cryptography"]

[features]
# Reserved (docs/api-stability.md): it used to expose the wrapped rustls; the TLS implementation
# is now this crate's own and nothing sits behind it. Kept so `only/unstable` still builds.
unstable = []
# Fuzz entry points for `fuzz/` (`only_tls::fuzzing`); not a public API.
fuzzing = []
# EXPERIMENTAL, not a public API and outside the semver promise: Linux kernel TLS offload for the
# blocking test stream (`stream::Stream::offload`), the `ktls-bench` example and
# `tls-interop --ktls`. Measured slower than only-tls's own record layer (docs/BENCHMARKS.md,
# "Kernel TLS"), so it is not wired into `Tls` / the engine.
experimental-ktls = ["dep:only-sys"]

[dependencies]
only-core = { workspace = true }
only-crypto = { workspace = true }
only-x509 = { workspace = true }
only-log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `experimental-ktls`: `setsockopt(SOL_TLS)`, record-type control messages.
only-sys = { workspace = true, optional = true }

[dev-dependencies]
# Only the comparison in examples/tls-bench.rs; never a dependency of the library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true

[[example]]
name = "ktls-bench"
required-features = ["experimental-ktls"]
