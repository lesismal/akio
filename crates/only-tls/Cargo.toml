[package]
name = "only-tls"
description = "only TLS: rustls driven sans-io as a transport layer under only connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-tls"
keywords = ["tls", "rustls", "network", "server", "client"]
categories = ["network-programming", "cryptography"]

[features]
# Raw access to the TLS implementation (`pub use rustls`, `ServerConfig::from_rustls` ...):
# outside the semver promise (docs/api-stability.md).
unstable = []

[dependencies]
only-core = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
