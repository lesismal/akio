[package]
name = "only-tls"
description = "only TLS: TLS 1.3 and 1.2 implemented in Rust without third-party dependencies, as a transport layer under only connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/only-tls"
keywords = ["tls", "network", "server", "client", "tls13"]
categories = ["network-programming", "cryptography"]

[features]
# Reserved (docs/api-stability.md): it used to expose the wrapped rustls; the TLS implementation
# is now this crate's own and nothing sits behind it. Kept so `only/unstable` still builds.
unstable = []
# Fuzz entry points for `fuzz/` (`only_tls::fuzzing`); not a public API.
fuzzing = []
# Linux kernel TLS (ADR-067): `ServerConfigBuilder::ktls` / `ClientConfigBuilder::ktls` move the
# record layer of engine connections into the kernel after the handshake: `Ktls::Hardware` only
# where a NIC does the crypto (TLS device offload), `Ktls::Software` always. Off by default:
# the kernel's software record layer is slower than only-tls's own (docs/BENCHMARKS.md, "Kernel
# TLS"). Without it (or off Linux) the setting is accepted and nothing is offloaded.
ktls = ["dep:only-sys"]
# The earlier name of `ktls`.
experimental-ktls = ["ktls"]

[dependencies]
only-core = { workspace = true }
only-crypto = { workspace = true }
only-x509 = { workspace = true }
# RFC 8879 certificate compression (zlib, brotli, zstd).
only-deflate = { workspace = true }
only-brotli = { workspace = true }
only-zstd = { workspace = true }
only-log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `ktls`: `setsockopt(SOL_TLS)`, record-type control messages, NIC offload detection.
only-sys = { workspace = true, optional = true }

[dev-dependencies]
# Only the comparison in examples/tls-bench.rs; never a dependency of the library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true

[[example]]
name = "ktls-bench"
required-features = ["ktls"]
