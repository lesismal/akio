[package]
name = "only-quic"
description = "only QUIC: quinn-proto driven over only UDP sockets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-quic"
keywords = ["quic", "udp", "network", "quinn"]
categories = ["network-programming"]

[dependencies]
only = { workspace = true }
only-core = { workspace = true }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
bytes = "1"
# quinn-proto's TLS: rustls configs built from only-tls's (src/rustls_bridge.rs), until the
# in-house QUIC drives only-tls's own TLS 1.3 (docs/DEV-PLAN.md wave D).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[features]
# Raw access to quinn-proto (`only_quic::proto`, `ServerConfig::from_quinn` ...): outside the
# semver promise (docs/api-stability.md).
unstable = []

[dev-dependencies]
only-x509 = { workspace = true }

[lints]
workspace = true
