[package]
name = "only-quic"
description = "only QUIC: QUIC v1 (RFC 9000/9001/9002) and datagrams (RFC 9221) in Rust over only UDP sockets, without third-party dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-quic"
keywords = ["quic", "udp", "network", "http3"]
categories = ["network-programming"]

[dependencies]
only = { workspace = true }
only-core = { workspace = true }
only-tls = { workspace = true }
only-crypto = { workspace = true }

[features]
# Reserved (docs/api-stability.md): it used to expose the wrapped quinn-proto; the QUIC
# implementation is now this crate's own and nothing sits behind it. Kept so `only/unstable`
# still builds.
unstable = []
# Fuzz entry points for `fuzz/` (`only_quic::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
only-x509 = { workspace = true }

[lints]
workspace = true
