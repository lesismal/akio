[package]
name = "flash"
description = "flash: an event-driven, thread-per-core network library (epoll, kqueue, io_uring) with TLS, UDP and eBPF steering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flash"
keywords = ["network", "event-loop", "io-uring", "epoll", "server"]
categories = ["network-programming"]

[dependencies]
flash-core = { workspace = true }
flash-epoll = { workspace = true }
flash-ebpf = { workspace = true }
flash-tls = { workspace = true }
flash-dpdk = { workspace = true, optional = true }
log = { version = "0.4.21", features = ["kv"] }

[target.'cfg(target_os = "linux")'.dependencies]
flash-uring = { workspace = true }

[features]
# Experimental (outside the semver promise, docs/api-stability.md): `Backend::Dpdk`, the
# userspace TCP/IP stack over TAP / AF_PACKET / in-memory devices.
dpdk = ["dep:flash-dpdk"]
# Also DPDK ports (`flash::dpdk::Device::Dpdk`): links libdpdk, found with pkg-config (Linux).
dpdk-pmd = ["dpdk", "flash-dpdk/pmd"]

[lints]
workspace = true

[dev-dependencies]
libc = "0.2"
flash-core = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
