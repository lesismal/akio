[package]
name = "flash"
description = "flash network library: flash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash-core = { workspace = true }
flash-epoll = { workspace = true }
flash-ebpf = { workspace = true }
