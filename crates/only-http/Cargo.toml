[package]
name = "only-http"
description = "only HTTP: HTTP/1.1 and HTTP/2 server, router, middleware, static files and clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-http"
keywords = ["http", "http2", "server", "router", "client"]
categories = ["network-programming", "web-programming::http-server", "web-programming::http-client"]

[dependencies]
only-core = { workspace = true }
only = { workspace = true }
httparse = "1"
log = { version = "0.4.21", features = ["kv"] }
only-crypto = { workspace = true }
loona-hpack = "0.4"
only-ws = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = { version = "1", optional = true }

[features]
default = ["regex"]
## Regexp route parameters (`/users/{id:[0-9]+}`).
regex = ["dep:regex"]
# Fuzz entry points for `fuzz/` (`only_http::fuzzing`); not a public API.
fuzzing = ["only-core/fuzzing"]

[dev-dependencies]
# A raw rustls client drives some tests (the library API hides rustls).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
only-core = { workspace = true, features = ["fuzzing"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"

[lints]
workspace = true
