[package]
name = "only-http"
description = "only HTTP: HTTP/1.1 and HTTP/2 server, router, middleware, static files and clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-http"
keywords = ["http", "http2", "server", "router", "client"]
categories = ["network-programming", "web-programming::http-server", "web-programming::http-client"]

[dependencies]
only-core = { workspace = true }
only = { workspace = true }
only-log = { workspace = true }
only-crypto = { workspace = true }
only-ws = { workspace = true }
only-deflate = { workspace = true }

[features]
default = ["regex"]
## Kept for compatibility, does nothing: regexp route parameters (`/users/{id:[0-9]+}`) are
## always available (an in-house engine replaced the `regex` crate in 1.0).
regex = []
# Fuzz entry points for `fuzz/` (`only_http::fuzzing`); not a public API.
fuzzing = ["only-core/fuzzing"]

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }
only-x509 = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"

[lints]
workspace = true
