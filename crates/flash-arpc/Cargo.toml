[package]
name = "flash-arpc"
description = "flash network library: arpc (wire-compatible with lesismal/arpc and fib/arpc)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash = { workspace = true }
flash-core = { workspace = true }
flash-buf = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`flash_arpc::fuzzing`); not a public API.
fuzzing = ["flash-core/fuzzing"]

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
