[package]
name = "flash-arpc"
description = "flash arpc: RPC wire-compatible with lesismal/arpc and fib/arpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flash-arpc"
keywords = ["rpc", "arpc", "network", "server", "client"]
categories = ["network-programming"]

[dependencies]
flash = { workspace = true }
flash-core = { workspace = true }
flash-buf = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`flash_arpc::fuzzing`); not a public API.
fuzzing = ["flash-core/fuzzing"]

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
