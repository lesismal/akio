[package]
name = "akio-zstd"
description = "akio internals: Zstandard (RFC 8878) compression and decompression in pure safe Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/akio-zstd"
keywords = ["zstd", "zstandard", "compression", "decompression"]
categories = ["compression"]

[dependencies]

[dev-dependencies]
# The benchmark compares ratios with akio-deflate (zlib level 9) on the same data.
akio-deflate = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`akio_zstd::fuzzing`); not a public API.
fuzzing = []

[lints]
workspace = true
