[package]
name = "flash-prefork"
description = "flash prefork: serve one program from several worker processes (SO_REUSEPORT or an inherited listener) with restarts, graceful shutdown and reload"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/flash-prefork"
keywords = ["prefork", "reuseport", "multi-process", "supervisor", "server"]
categories = ["network-programming", "os::unix-apis"]

[dependencies]
flash = { workspace = true }
log = { version = "0.4.21", features = ["kv"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
flash-sys = { workspace = true }

[dev-dependencies]
flash-http = { workspace = true }

# The tests re-execute their own binary as the workers, so they need their own `main`.
[[test]]
name = "prefork"
harness = false

[lints]
workspace = true
