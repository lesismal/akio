[package]
name = "akio-socks"
description = "akio: SOCKS5/4/4a and HTTP CONNECT proxies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/akio-socks"
keywords = ["socks", "socks5", "proxy", "network"]
categories = ["network-programming"]

[dependencies]
akio = { workspace = true }
akio-core = { workspace = true }
akio-http = { workspace = true }
akio-mux = { workspace = true }
akio-ws = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`akio_socks::fuzzing`); not a public API.
fuzzing = ["akio-core/fuzzing"]

[dev-dependencies]
akio-core = { workspace = true, features = ["fuzzing"] }
# Test certificates for the TLS-to-the-proxy tests.
akio-x509 = { workspace = true }
# CONNECT on HTTP/3 streams (tests/connect_streams.rs).
akio-h3 = { path = "../akio-h3" }
akio-quic = { workspace = true }

[lints]
workspace = true
