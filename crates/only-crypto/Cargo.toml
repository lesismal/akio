[package]
name = "only-crypto"
description = "only internals: dependency-free hashes, HMAC/HKDF/PBKDF2, CRC32, constant-time AES (CTR, GCM), ChaCha20-Poly1305, base64, OS randomness, X25519, Ed25519, P-256/P-384 ECDH and ECDSA, RSA signatures, DER/PEM and key formats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/only-crypto"
keywords = ["crypto", "aes-gcm", "sha256", "hmac", "chacha20poly1305"]
categories = ["cryptography"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# getrandom(2) / getentropy(2): the syscall wrapper lives with the rest of the workspace's unsafe.
only-sys = { workspace = true }

[dev-dependencies]
# Cross-checks and the throughput comparison (examples/bench.rs) against the crates this one
# replaced; never linked into a library build.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
crc32fast = "1"
base64 = "0.22"
hkdf = "0.12"
chacha20poly1305 = "0.10"
# Public-key cross-checks and the comparison in examples/pk_bench.rs.
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }

[lints]
workspace = true
