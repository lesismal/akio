[package]
name = "akio-arpc"
description = "akio arpc: RPC wire-compatible with lesismal/arpc and fib/arpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/akio-arpc"
keywords = ["rpc", "arpc", "network", "server", "client"]
categories = ["network-programming"]

[dependencies]
akio = { workspace = true }
akio-core = { workspace = true }
akio-buf = { workspace = true }
akio-deflate = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`akio_arpc::fuzzing`); not a public API.
fuzzing = ["akio-core/fuzzing"]

[dev-dependencies]
akio-core = { workspace = true, features = ["fuzzing"] }
akio-deflate = { workspace = true }

[lints]
workspace = true
