[package]
name = "flash-kcp"
description = "flash network library: KCP (wire-compatible with skywind3000/kcp and kcp-go)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash = { workspace = true }
flash-core = { workspace = true }
aes = "0.8"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
crc32fast = "1"
getrandom = "0.2"

[features]
# Fuzz entry points for `fuzz/` (`flash_kcp::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
