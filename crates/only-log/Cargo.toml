[package]
name = "only-log"
description = "only's logging facade: levels, targets, structured key-values, a global logger and built-in stderr loggers, without dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/only-log"
keywords = ["logging", "log", "structured", "facade"]
categories = ["development-tools::debugging"]

[dependencies]
# Optional bridge to the `log` crate (feature `log`): records go to `log`'s logger while no
# only-log logger is installed, `log` records can be routed into only-log, and the level types
# convert both ways. Outside the semver promise (docs/api-stability.md).
log = { version = "0.4.21", features = ["kv", "std"], optional = true }

[features]
log = ["dep:log"]

[dev-dependencies]
# The overhead benchmark compares the disabled-level fast path with `log`'s.
log = { version = "0.4.21", features = ["kv"] }

[[bench]]
name = "overhead"
harness = false

[lints]
workspace = true
