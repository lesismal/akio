[package]
name = "flash-h3"
description = "flash network library: HTTP/3 (RFC 9114) with QPACK over flash-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash = { path = "../flash" }
flash-core = { path = "../flash-core" }
flash-http = { path = "../flash-http" }
flash-quic = { path = "../flash-quic" }
bytes = "1"
loona-hpack = "0.4"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
