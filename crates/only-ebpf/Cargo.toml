[package]
name = "only-ebpf"
description = "only acceleration: SO_REUSEPORT steering (classic BPF / eBPF) and a sockmap relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-ebpf"
keywords = ["ebpf", "bpf", "reuseport", "linux", "network"]
categories = ["network-programming", "os::linux-apis"]

[dependencies]
only-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
only-sys = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`only_ebpf::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
libc = "0.2"
only-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
