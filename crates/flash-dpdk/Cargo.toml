[package]
name = "flash-dpdk"
description = "flash kernel-bypass backend (experimental): a userspace TCP/IP stack (smoltcp) over DPDK ports, TAP, AF_PACKET or in-memory devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/flash-dpdk"
keywords = ["dpdk", "kernel-bypass", "smoltcp", "network", "userspace"]
categories = ["network-programming"]
links = "flash_dpdk_shim"

[dependencies]
flash-core = { workspace = true }
log = "0.4.21"
# The userspace TCP/IP stack. IPv4 only for now (ARP is fanned out between queues; IPv6
# neighbor discovery is not). The `phy-*` features are the TAP / AF_PACKET devices (Linux).
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "phy-raw_socket",
    "phy-tuntap_interface",
] }

[build-dependencies]
cc = { version = "1.2", optional = true }
pkg-config = { version = "0.3.30", optional = true }

[features]
# Link DPDK (`pkg-config libdpdk`) and enable `Device::Dpdk`. When libdpdk is not found at build
# time the crate still builds and `Device::Dpdk` fails at runtime with `Unsupported` (set
# FLASH_DPDK_REQUIRE=1 to make that a build error instead).
pmd = ["dep:cc", "dep:pkg-config"]

[dev-dependencies]
flash = { workspace = true, features = ["dpdk"] }
flash-kcp = { workspace = true }

[lints]
workspace = true
