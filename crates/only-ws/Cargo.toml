[package]
name = "only-ws"
description = "only WebSocket (RFC 6455) server sessions and client, with permessage-deflate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-ws"
keywords = ["websocket", "ws", "network", "server", "client"]
categories = ["network-programming", "web-programming::websocket"]

[dependencies]
only-core = { workspace = true }
only-buf = { workspace = true }
only-crypto = { workspace = true }
only-deflate = { workspace = true }
only = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`only_ws::fuzzing`); not a public API.
fuzzing = ["only-core/fuzzing"]

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }
only-http = { workspace = true }
only-x509 = { workspace = true }

[lints]
workspace = true
