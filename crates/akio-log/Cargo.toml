[package]
name = "akio-log"
description = "akio's logging facade: levels, targets, structured key-values, a global logger and built-in stderr loggers, without third-party dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/akio-log"
keywords = ["logging", "log", "structured", "facade"]
categories = ["development-tools::debugging"]

[dependencies]
# The `/regex` message filters (ADR-047): the in-house linear-time engine.
akio-regex = { workspace = true }
# Optional bridge to the `log` crate (feature `log`): records go to `log`'s logger while no
# akio-log logger is installed, `log` records can be routed into akio-log, and the level types
# convert both ways. Outside the semver promise (docs/api-stability.md).
log = { version = "0.4.21", features = ["kv", "std"], optional = true }

[features]
log = ["dep:log"]
# Compile-time level caps, like the `log` crate's: statements more verbose than the cap are
# compiled out (`STATIC_MAX_LEVEL`). `release_max_level_*` applies to builds without
# debug assertions and takes precedence there. When several are enabled (features are unified
# across the dependency graph) the most restrictive wins. For applications, not libraries.
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []

[dev-dependencies]
# The overhead benchmark compares the disabled-level fast path with `log`'s.
log = { version = "0.4.21", features = ["kv"] }

[[bench]]
name = "overhead"
harness = false

[lints]
workspace = true
