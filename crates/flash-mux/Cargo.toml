[package]
name = "flash-mux"
description = "flash network library: several protocols on one port, told apart by their first bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flash-core = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`flash_mux::fuzzing`); not a public API.
fuzzing = ["flash-core/fuzzing"]

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }
flash = { workspace = true }
flash-http = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
