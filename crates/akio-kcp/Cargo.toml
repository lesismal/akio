[package]
name = "akio-kcp"
description = "akio KCP: reliable UDP wire-compatible with skywind3000/kcp and kcp-go (crypt, FEC)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/akio-kcp"
keywords = ["kcp", "udp", "arq", "network"]
categories = ["network-programming"]

[dependencies]
akio = { workspace = true }
akio-core = { workspace = true }
akio-crypto = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`akio_kcp::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
akio-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
