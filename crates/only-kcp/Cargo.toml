[package]
name = "only-kcp"
description = "only KCP: reliable UDP wire-compatible with skywind3000/kcp and kcp-go (crypt, FEC)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-kcp"
keywords = ["kcp", "udp", "arq", "network"]
categories = ["network-programming"]

[dependencies]
only = { workspace = true }
only-core = { workspace = true }
only-crypto = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`only_kcp::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
