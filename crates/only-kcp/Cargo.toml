[package]
name = "only-kcp"
description = "only KCP: reliable UDP wire-compatible with skywind3000/kcp and kcp-go (crypt, FEC)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-kcp"
keywords = ["kcp", "udp", "arq", "network"]
categories = ["network-programming"]

[dependencies]
only = { workspace = true }
only-core = { workspace = true }
aes = "0.8"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
crc32fast = "1"
getrandom = "0.2"

[features]
# Fuzz entry points for `fuzz/` (`only_kcp::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
