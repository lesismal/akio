[package]
name = "only-webrtc"
description = "only WebRTC: ICE, DTLS-SRTP, SCTP data channels and RTP media (in-house sans-io stack) over only UDP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/only-webrtc"
keywords = ["webrtc", "ice", "dtls", "srtp", "sctp"]
categories = ["network-programming", "multimedia"]

[features]
# Fuzz entry points for `fuzz/` (`only_webrtc::fuzzing`); not a public API.
fuzzing = []
# Reserved for APIs outside the semver promise (docs/api-stability.md); empty since the in-house
# stack replaced str0m.
unstable = []

[dependencies]
only = { workspace = true }
only-turn = { workspace = true }
only-crypto = { workspace = true }
only-dtls = { workspace = true }
only-ice = { workspace = true }
only-rtp = { workspace = true }
only-sctp = { workspace = true }
only-srtp = { workspace = true }
only-log = { workspace = true }

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }
only-x509 = { workspace = true }

[lints]
workspace = true
