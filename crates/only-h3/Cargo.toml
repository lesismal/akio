[package]
name = "only-h3"
description = "only HTTP/3 (RFC 9114) with QPACK over only-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only-h3"
keywords = ["http3", "h3", "quic", "qpack", "network"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
only = { workspace = true }
only-core = { workspace = true }
only-http = { workspace = true }
only-quic = { workspace = true }

[features]
# Fuzz entry points for `fuzz/` (`only_h3::fuzzing`); not a public API.
fuzzing = []

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }
only-x509 = { workspace = true }

[lints]
workspace = true

# Drives this side's QPACK encoder for tools/interop/h3/nghttp3-qpack.py.
[[example]]
name = "qpack-pipe"
required-features = ["fuzzing"]
