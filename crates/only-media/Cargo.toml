[package]
name = "only-media"
description = "only streaming media: RTMP, RTSP, SRT, FLV, HTTP-FLV, WS-FLV, HLS (MPEG-TS, fMP4, multivariant, AES-128), WHIP/WHEP, RTMP/RTSP clients, recording and a stream hub; H.264, H.265, VP8, VP9, AV1, AAC, Opus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/only-media"
keywords = ["rtmp", "rtsp", "srt", "hls", "streaming"]
categories = ["network-programming", "multimedia"]

[dependencies]
only = { workspace = true }
only-core = { workspace = true }
only-http = { workspace = true }
only-crypto = { workspace = true }
# VP8, VP9 and AV1 RTP payload formats (RTSP).
only-rtp = { workspace = true }
# WebRTC media for WHIP/WHEP (`only_media::webrtc`), behind the `webrtc` feature.
only-webrtc = { workspace = true, optional = true }

[features]
# Fuzz entry points for `fuzz/` (`only_media::fuzzing`); not a public API.
fuzzing = ["only-core/fuzzing"]
# WHIP ingest and WHEP playback through only-webrtc (`only_media::webrtc::RtcMedia`).
webrtc = ["dep:only-webrtc"]

[dev-dependencies]
only-core = { workspace = true, features = ["fuzzing"] }

[[example]]
name = "whip-server"
required-features = ["webrtc"]

[lints]
workspace = true
