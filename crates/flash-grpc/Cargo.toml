[package]
name = "flash-grpc"
description = "flash gRPC: unary and streaming calls over the HTTP/2 of flash-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flash-grpc"
keywords = ["grpc", "rpc", "http2", "network"]
categories = ["network-programming", "web-programming"]

[dependencies]
flash = { workspace = true }
flash-http = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
prost = { version = "0.13", optional = true }
flash-core = { workspace = true, optional = true }

[features]
# Typed helpers for prost-generated messages.
prost = ["dep:prost"]
# Fuzz entry points for `fuzz/` (`flash_grpc::fuzzing`); not a public API.
fuzzing = ["dep:flash-core", "flash-core/fuzzing", "flash-http/fuzzing"]

[dev-dependencies]
flash-core = { workspace = true, features = ["fuzzing"] }
flash-http = { workspace = true, features = ["fuzzing"] }

[lints]
workspace = true
