[package]
name = "only"
description = "only: an event-driven, thread-per-core network library (epoll, kqueue, io_uring) with TLS, UDP and eBPF steering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/only"
keywords = ["network", "event-loop", "io-uring", "epoll", "server"]
categories = ["network-programming"]

[dependencies]
only-core = { workspace = true }
only-buf = { workspace = true }
only-epoll = { workspace = true }
only-ebpf = { workspace = true }
only-tls = { workspace = true }
only-dpdk = { workspace = true, optional = true }
only-log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
only-uring = { workspace = true }

[features]
# Experimental (outside the semver promise, docs/api-stability.md): `Backend::Dpdk`, the
# userspace TCP/IP stack over TAP / AF_PACKET / in-memory devices.
dpdk = ["dep:only-dpdk"]
# Also DPDK ports (`only::dpdk::Device::Dpdk`): links libdpdk, found with pkg-config (Linux).
dpdk-pmd = ["dpdk", "only-dpdk/pmd"]
# Raw access to wrapped dependencies (`only::tls::rustls`, `from_rustls` ...): outside the
# semver promise (docs/api-stability.md).
unstable = ["only-tls/unstable"]
# Bridge to the `log` crate: `only`'s records go to `log`'s logger (env_logger, tracing-log ...)
# while no only-log logger is installed; `only::log::bridge` routes `log` records the other way.
# Outside the semver promise (docs/api-stability.md).
log = ["only-core/log", "only-log/log"]

[lints]
workspace = true

[dev-dependencies]
# Interop: a rustls client drives tests/tls.rs and tests/chaos_tls.rs against the own TLS stack
# (a dev-dependency only: no library of the workspace uses rustls since DEV-PLAN wave D).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
libc = "0.2"
only-core = { workspace = true }
only-buf = { workspace = true }
only-x509 = { workspace = true }
# tests/reload.rs: reads a listening socket's backlog back (Linux).
only-sys = { workspace = true }
# tests/logging_bridge.rs: the `log` bridge, with a `log` crate logger.
only-log = { workspace = true, features = ["log"] }
log = { version = "0.4.21", features = ["kv"] }
