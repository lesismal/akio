// Every proto3 feature the generator supports, for the golden (protoc) conformance tests, the
// round-trip tests and the prost differential tests.
syntax = "proto3";

package test.all;

import "common.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "example.com/test/all";

// An open enum, with a negative value.
enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
  COLOR_NEGATIVE = -1;
}

// All field kinds. See [the docs](https://protobuf.dev) for <details>.
message AllTypes {
  int32 f_int32 = 1;
  int64 f_int64 = 2;
  uint32 f_uint32 = 3;
  uint64 f_uint64 = 4;
  sint32 f_sint32 = 5;
  sint64 f_sint64 = 6;
  fixed32 f_fixed32 = 7;
  fixed64 f_fixed64 = 8;
  sfixed32 f_sfixed32 = 9;
  sfixed64 f_sfixed64 = 10;
  float f_float = 11;
  double f_double = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  Nested f_nested = 17;
  test.common.Shared f_shared = 18;

  optional int32 o_int32 = 19;
  optional string o_string = 20;
  optional Color o_enum = 21;
  optional Nested o_nested = 22;

  repeated int32 r_int32 = 31;
  repeated sint64 r_sint64 = 32;
  repeated fixed32 r_fixed32 = 33;
  repeated double r_double = 34;
  repeated bool r_bool = 35;
  repeated Color r_enum = 36;
  repeated int32 r_int32_unpacked = 37 [packed = false];
  repeated string r_string = 38;
  repeated bytes r_bytes = 39;
  repeated Nested r_nested = 40;
  repeated uint64 r_uint64 = 41;

  map<string, int32> m_string_int32 = 50;
  map<int64, string> m_int64_string = 51;
  map<bool, Nested> m_bool_nested = 52;
  map<uint32, Color> m_uint32_enum = 53;
  map<sint32, bytes> m_sint32_bytes = 54;
  map<fixed64, double> m_fixed64_double = 55;

  oneof choice {
    uint32 c_uint32 = 60;
    string c_string = 61;
    Nested c_nested = 62;
    bytes c_bytes = 63;
    Color c_enum = 64;
    AllTypes c_self = 65;
  }

  // Recursive: boxed in Rust.
  AllTypes recursive = 70;

  google.protobuf.Timestamp ts = 80;
  google.protobuf.Any any = 81;
  google.protobuf.Struct st = 82;
  google.protobuf.Int32Value wrapped = 83;

  int32 max_field_number = 536870911;

  // A nested message with a keyword field and a self reference.
  message Nested {
    int32 a = 1;
    Nested child = 2;
    string type = 3;
    Inner.Deep deep = 4;

    message Inner {
      enum Deep {
        DEEP_ZERO = 0;
        DEEP_ONE = 1;
      }
    }
  }
}

// A message with fields the other one does not know (for unknown-field tests): fields 1 and 14
// of `AllTypes` plus fields it does not declare.
message Extended {
  int32 f_int32 = 1;
  string f_string = 14;
  int64 extra_varint = 1000;
  string extra_string = 1001;
  fixed32 extra_fixed32 = 1002;
  fixed64 extra_fixed64 = 1003;
  AllTypes.Nested extra_message = 1004;
}

// The same fields as `AllTypes` 1 and 14 only.
message Small {
  int32 f_int32 = 1;
  string f_string = 14;
}
