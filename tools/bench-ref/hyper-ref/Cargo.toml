[package]
name = "hyper-ref"
version = "0.0.0"
edition = "2021"
publish = false

# Reference HTTP server for docs/BENCHMARKS.md. Kept out of the `akio` workspace on purpose.
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
