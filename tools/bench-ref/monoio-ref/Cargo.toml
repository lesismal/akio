[package]
name = "monoio-ref"
version = "0.0.0"
edition = "2021"
publish = false

# Reference server for docs/BENCHMARKS.md. Kept out of the `akio` workspace on purpose.
[workspace]

[dependencies]
monoio = { version = "0.2.4", default-features = false, features = ["iouring", "legacy", "macros", "bytes", "utils"] }
httparse = "1.10"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
