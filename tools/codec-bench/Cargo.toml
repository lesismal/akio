[package]
name = "codec-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace (excluded from the root one), so the reference crates it measures against
# (httparse, loona-hpack, regex, libbrotli, libzstd) stay out of the libraries' dependency graph and Cargo.lock.
[workspace]

[dependencies]
akio-http = { path = "../../crates/akio-http" }
akio-ws = { path = "../../crates/akio-ws" }
akio-regex = { path = "../../crates/akio-regex" }
akio-brotli = { path = "../../crates/akio-brotli" }
akio-zstd = { path = "../../crates/akio-zstd" }
httparse = "1"
loona-hpack = "0.4"
regex = "1"
# The C reference libraries, built from their bundled sources.
brotlic-sys = "0.2"
zstd = { version = "0.13", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
