[workspace]
resolver = "3"
members = [
    "crates/flash-sys",
    "crates/flash-buf",
    "crates/flash-timer",
    "crates/flash-pool",
    "crates/flash-core",
    "crates/flash-epoll",
    "crates/flash-uring",
    "crates/flash-tls",
    "crates/flash-http",
    "crates/flash-ws",
    "crates/flash-mux",
    "crates/flash-socks",
    "crates/flash-arpc",
    "crates/flash-grpc",
    "crates/flash-kcp",
    "crates/flash-quic",
    "crates/flash-h3",
    "crates/flash-ebpf",
    "crates/flash",
    "tools/echo-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lesismal/flash"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"

# Clippy: the default groups plus a curated set of pedantic / nursery / restriction lints that
# catch real mistakes or keep the code uniform without much noise. `unwrap_used` is enabled
# per library crate (`#![warn(clippy::unwrap_used)]` in each lib.rs) so tests and examples
# can keep using `unwrap()`; see clippy.toml for `allow-unwrap-in-tests`.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
fn_to_numeric_cast_any = "warn"
lossy_float_literal = "warn"
# pedantic
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
mut_mut = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
range_plus_one = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
transmute_ptr_to_ptr = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
zero_sized_map_values = "warn"
# nursery
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
