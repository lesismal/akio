[workspace]
resolver = "3"
members = [
    "crates/flash-sys",
    "crates/flash-buf",
    "crates/flash-timer",
    "crates/flash-pool",
    "crates/flash-core",
    "crates/flash-epoll",
    "crates/flash-uring",
    "crates/flash-tls",
    "crates/flash-http",
    "crates/flash-ws",
    "crates/flash-mux",
    "crates/flash-socks",
    "crates/flash-arpc",
    "crates/flash-grpc",
    "crates/flash-kcp",
    "crates/flash-quic",
    "crates/flash-h3",
    "crates/flash-ebpf",
    "crates/flash-turn",
    "crates/flash-webrtc",
    "crates/flash",
    "tools/echo-bench",
]
# The cargo-fuzz project is its own (nightly-only) workspace.
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lesismal/flash"
rust-version = "1.85"
readme = "README.md"
homepage = "https://lesismal.github.io/flash/"

[workspace.dependencies]
# Workspace crates: a path for local builds plus the version crates.io resolves once published
# (a path-only dependency is a wildcard to cargo-deny and cannot be published). The versions are
# exact (`=`): all crates are released in lockstep, and the internal crates (flash-sys, -buf,
# -timer, -pool, -epoll, -uring) may change their APIs in any release (docs/api-stability.md).
flash-sys = { path = "crates/flash-sys", version = "=1.0.0-rc.1" }
flash-buf = { path = "crates/flash-buf", version = "=1.0.0-rc.1" }
flash-timer = { path = "crates/flash-timer", version = "=1.0.0-rc.1" }
flash-pool = { path = "crates/flash-pool", version = "=1.0.0-rc.1" }
flash-core = { path = "crates/flash-core", version = "=1.0.0-rc.1" }
flash-epoll = { path = "crates/flash-epoll", version = "=1.0.0-rc.1" }
flash-uring = { path = "crates/flash-uring", version = "=1.0.0-rc.1" }
flash-tls = { path = "crates/flash-tls", version = "=1.0.0-rc.1" }
flash-http = { path = "crates/flash-http", version = "=1.0.0-rc.1" }
flash-ws = { path = "crates/flash-ws", version = "=1.0.0-rc.1" }
flash-quic = { path = "crates/flash-quic", version = "=1.0.0-rc.1" }
flash-h3 = { path = "crates/flash-h3", version = "=1.0.0-rc.1" }
flash-kcp = { path = "crates/flash-kcp", version = "=1.0.0-rc.1" }
flash-grpc = { path = "crates/flash-grpc", version = "=1.0.0-rc.1" }
flash-arpc = { path = "crates/flash-arpc", version = "=1.0.0-rc.1" }
flash-socks = { path = "crates/flash-socks", version = "=1.0.0-rc.1" }
flash-mux = { path = "crates/flash-mux", version = "=1.0.0-rc.1" }
flash-ebpf = { path = "crates/flash-ebpf", version = "=1.0.0-rc.1" }
flash-turn = { path = "crates/flash-turn", version = "=1.0.0-rc.1" }
flash-webrtc = { path = "crates/flash-webrtc", version = "=1.0.0-rc.1" }
flash = { path = "crates/flash", version = "=1.0.0-rc.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
# 1.0 API conventions (docs/api-stability.md): every public type is `Debug`.
missing_debug_implementations = "warn"

# Clippy: the default groups plus a curated set of pedantic / nursery / restriction lints that
# catch real mistakes or keep the code uniform without much noise. `unwrap_used` is enabled
# per library crate (`#![warn(clippy::unwrap_used)]` in each lib.rs) so tests and examples
# can keep using `unwrap()`; see clippy.toml for `allow-unwrap-in-tests`.
[workspace.lints.clippy]
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment, every `unsafe fn` a
# `# Safety` section (docs/unsafe-review.md).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# 1.0 API conventions: builder methods returning `Self` are `#[must_use]`.
return_self_not_must_use = "warn"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
fn_to_numeric_cast_any = "warn"
lossy_float_literal = "warn"
# pedantic
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
mut_mut = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
range_plus_one = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
transmute_ptr_to_ptr = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
zero_sized_map_values = "warn"
# nursery
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
