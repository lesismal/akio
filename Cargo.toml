[workspace]
resolver = "3"
members = [
    "crates/flash-sys",
    "crates/flash-buf",
    "crates/flash-timer",
    "crates/flash-pool",
    "crates/flash-core",
    "crates/flash-epoll",
    "crates/flash-uring",
    "crates/flash-tls",
    "crates/flash-http",
    "crates/flash-ws",
    "crates/flash-mux",
    "crates/flash-socks",
    "crates/flash-arpc",
    "crates/flash-grpc",
    "crates/flash-kcp",
    "crates/flash-quic",
    "crates/flash-h3",
    "crates/flash-ebpf",
    "crates/flash",
    "tools/echo-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lesismal/flash"
rust-version = "1.85"

[workspace.dependencies]
# Workspace crates: a path for local builds plus the version crates.io resolves once published
# (a path-only dependency is a wildcard to cargo-deny and cannot be published).
flash-sys = { path = "crates/flash-sys", version = "0.0.0" }
flash-buf = { path = "crates/flash-buf", version = "0.0.0" }
flash-timer = { path = "crates/flash-timer", version = "0.0.0" }
flash-pool = { path = "crates/flash-pool", version = "0.0.0" }
flash-core = { path = "crates/flash-core", version = "0.0.0" }
flash-epoll = { path = "crates/flash-epoll", version = "0.0.0" }
flash-uring = { path = "crates/flash-uring", version = "0.0.0" }
flash-tls = { path = "crates/flash-tls", version = "0.0.0" }
flash-http = { path = "crates/flash-http", version = "0.0.0" }
flash-ws = { path = "crates/flash-ws", version = "0.0.0" }
flash-quic = { path = "crates/flash-quic", version = "0.0.0" }
flash-ebpf = { path = "crates/flash-ebpf", version = "0.0.0" }
flash = { path = "crates/flash", version = "0.0.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment, every `unsafe fn` a
# `# Safety` section (docs/unsafe-review.md).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
