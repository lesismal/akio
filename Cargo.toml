[workspace]
resolver = "3"
members = [
    "crates/only-sys",
    "crates/only-buf",
    "crates/only-deflate",
    "crates/only-timer",
    "crates/only-pool",
    "crates/only-core",
    "crates/only-epoll",
    "crates/only-uring",
    "crates/only-tls",
    "crates/only-http",
    "crates/only-ws",
    "crates/only-mux",
    "crates/only-socks",
    "crates/only-arpc",
    "crates/only-grpc",
    "crates/only-kcp",
    "crates/only-quic",
    "crates/only-h3",
    "crates/only-ebpf",
    "crates/only-prefork",
    "crates/only-dpdk",
    "crates/only-turn",
    "crates/only-webrtc",
    "crates/only-media",
    "crates/only-bittorrent",
    "crates/only",
    "tools/echo-bench",
]
# The cargo-fuzz project is its own (nightly-only) workspace.
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lesismal/only"
rust-version = "1.85"
readme = "README.md"
homepage = "https://lesismal.github.io/only/"

[workspace.dependencies]
# Workspace crates: a path for local builds plus the version crates.io resolves once published
# (a path-only dependency is a wildcard to cargo-deny and cannot be published). The versions are
# exact (`=`): all crates are released in lockstep, and the internal crates (only-sys, -buf,
# -timer, -pool, -epoll, -uring) may change their APIs in any release (docs/api-stability.md).
only-sys = { path = "crates/only-sys", version = "=1.0.0-rc.1" }
only-buf = { path = "crates/only-buf", version = "=1.0.0-rc.1" }
only-deflate = { path = "crates/only-deflate", version = "=1.0.0-rc.1" }
only-timer = { path = "crates/only-timer", version = "=1.0.0-rc.1" }
only-pool = { path = "crates/only-pool", version = "=1.0.0-rc.1" }
only-core = { path = "crates/only-core", version = "=1.0.0-rc.1" }
only-epoll = { path = "crates/only-epoll", version = "=1.0.0-rc.1" }
only-uring = { path = "crates/only-uring", version = "=1.0.0-rc.1" }
only-tls = { path = "crates/only-tls", version = "=1.0.0-rc.1" }
only-http = { path = "crates/only-http", version = "=1.0.0-rc.1" }
only-ws = { path = "crates/only-ws", version = "=1.0.0-rc.1" }
only-quic = { path = "crates/only-quic", version = "=1.0.0-rc.1" }
only-h3 = { path = "crates/only-h3", version = "=1.0.0-rc.1" }
only-kcp = { path = "crates/only-kcp", version = "=1.0.0-rc.1" }
only-grpc = { path = "crates/only-grpc", version = "=1.0.0-rc.1" }
only-arpc = { path = "crates/only-arpc", version = "=1.0.0-rc.1" }
only-socks = { path = "crates/only-socks", version = "=1.0.0-rc.1" }
only-mux = { path = "crates/only-mux", version = "=1.0.0-rc.1" }
only-ebpf = { path = "crates/only-ebpf", version = "=1.0.0-rc.1" }
only-dpdk = { path = "crates/only-dpdk", version = "=1.0.0-rc.1" }
only-turn = { path = "crates/only-turn", version = "=1.0.0-rc.1" }
only-webrtc = { path = "crates/only-webrtc", version = "=1.0.0-rc.1" }
only-media = { path = "crates/only-media", version = "=1.0.0-rc.1" }
only-bittorrent = { path = "crates/only-bittorrent", version = "=1.0.0-rc.1" }
only = { path = "crates/only", version = "=1.0.0-rc.1" }
only-prefork = { path = "crates/only-prefork", version = "=1.0.0-rc.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
# 1.0 API conventions (docs/api-stability.md): every public type is `Debug`.
missing_debug_implementations = "warn"

# Clippy: the default groups plus a curated set of pedantic / nursery / restriction lints that
# catch real mistakes or keep the code uniform without much noise. `unwrap_used` is enabled
# per library crate (`#![warn(clippy::unwrap_used)]` in each lib.rs) so tests and examples
# can keep using `unwrap()`; see clippy.toml for `allow-unwrap-in-tests`.
[workspace.lints.clippy]
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment, every `unsafe fn` a
# `# Safety` section (docs/unsafe-review.md).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# 1.0 API conventions: builder methods returning `Self` are `#[must_use]`.
return_self_not_must_use = "warn"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
fn_to_numeric_cast_any = "warn"
lossy_float_literal = "warn"
# pedantic
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
mut_mut = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
range_plus_one = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
transmute_ptr_to_ptr = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
zero_sized_map_values = "warn"
# nursery
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
