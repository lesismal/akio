[workspace]
resolver = "3"
members = [
    "crates/akio-sys",
    "crates/akio-regex",
    "crates/akio-log",
    "crates/akio-export",
    "crates/akio-crypto",
    "crates/akio-x509",
    "crates/akio-dtls",
    "crates/akio-srtp",
    "crates/akio-rtp",
    "crates/akio-sctp",
    "crates/akio-ice",
    "crates/akio-buf",
    "crates/akio-deflate",
    "crates/akio-brotli",
    "crates/akio-zstd",
    "crates/akio-timer",
    "crates/akio-pool",
    "crates/akio-core",
    "crates/akio-epoll",
    "crates/akio-uring",
    "crates/akio-tls",
    "crates/akio-http",
    "crates/akio-ws",
    "crates/akio-mux",
    "crates/akio-socks",
    "crates/akio-arpc",
    "crates/akio-grpc",
    "crates/akio-protobuf",
    "crates/akio-protobuf-build",
    "crates/akio-kcp",
    "crates/akio-quic",
    "crates/akio-h3",
    "crates/akio-ebpf",
    "crates/akio-prefork",
    "crates/akio-dpdk",
    "crates/akio-tun",
    "crates/akio-turn",
    "crates/akio-webrtc",
    "crates/akio-media",
    "crates/akio-bittorrent",
    "crates/akio",
    "tools/ct-dudect",
    "tools/echo-bench",
    "tools/protobuf-test",
]
# The cargo-fuzz project (nightly-only), the codec micro benchmarks (which measure against
# the third-party crates the libraries replaced) and akio-regex's table generator (which reads
# regex-syntax) are their own workspaces.
exclude = ["fuzz", "tools/codec-bench", "tools/regex-tables"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lesismal/akio"
rust-version = "1.85"
readme = "README.md"
homepage = "https://lesismal.github.io/akio/"

[workspace.dependencies]
# Workspace crates: a path for local builds plus the version crates.io resolves once published
# (a path-only dependency is a wildcard to cargo-deny and cannot be published). The versions are
# exact (`=`): all crates are released in lockstep, and the internal crates (akio-sys, -buf,
# -timer, -pool, -epoll, -uring) may change their APIs in any release (docs/api-stability.md).
akio-sys = { path = "crates/akio-sys", version = "=1.0.0-rc.1" }
akio-regex = { path = "crates/akio-regex", version = "=1.0.0-rc.1" }
akio-log = { path = "crates/akio-log", version = "=1.0.0-rc.1" }
akio-crypto = { path = "crates/akio-crypto", version = "=1.0.0-rc.1" }
akio-x509 = { path = "crates/akio-x509", version = "=1.0.0-rc.1" }
akio-dtls = { path = "crates/akio-dtls", version = "=1.0.0-rc.1" }
akio-srtp = { path = "crates/akio-srtp", version = "=1.0.0-rc.1" }
akio-rtp = { path = "crates/akio-rtp", version = "=1.0.0-rc.1" }
akio-sctp = { path = "crates/akio-sctp", version = "=1.0.0-rc.1" }
akio-ice = { path = "crates/akio-ice", version = "=1.0.0-rc.1" }
akio-buf = { path = "crates/akio-buf", version = "=1.0.0-rc.1" }
akio-deflate = { path = "crates/akio-deflate", version = "=1.0.0-rc.1" }
akio-brotli = { path = "crates/akio-brotli", version = "=1.0.0-rc.1" }
akio-zstd = { path = "crates/akio-zstd", version = "=1.0.0-rc.1" }
akio-timer = { path = "crates/akio-timer", version = "=1.0.0-rc.1" }
akio-pool = { path = "crates/akio-pool", version = "=1.0.0-rc.1" }
akio-core = { path = "crates/akio-core", version = "=1.0.0-rc.1" }
akio-epoll = { path = "crates/akio-epoll", version = "=1.0.0-rc.1" }
akio-uring = { path = "crates/akio-uring", version = "=1.0.0-rc.1" }
akio-tls = { path = "crates/akio-tls", version = "=1.0.0-rc.1" }
akio-http = { path = "crates/akio-http", version = "=1.0.0-rc.1" }
akio-mux = { path = "crates/akio-mux", version = "=1.0.0-rc.1" }
akio-ws = { path = "crates/akio-ws", version = "=1.0.0-rc.1" }
akio-quic = { path = "crates/akio-quic", version = "=1.0.0-rc.1" }
akio-kcp = { path = "crates/akio-kcp", version = "=1.0.0-rc.1" }
akio-grpc = { path = "crates/akio-grpc", version = "=1.0.0-rc.1" }
akio-protobuf = { path = "crates/akio-protobuf", version = "=1.0.0-rc.1" }
akio-protobuf-build = { path = "crates/akio-protobuf-build", version = "=1.0.0-rc.1" }
akio-ebpf = { path = "crates/akio-ebpf", version = "=1.0.0-rc.1" }
akio-dpdk = { path = "crates/akio-dpdk", version = "=1.0.0-rc.1" }
akio-tun = { path = "crates/akio-tun", version = "=1.0.0-rc.1" }
akio-turn = { path = "crates/akio-turn", version = "=1.0.0-rc.1" }
akio-webrtc = { path = "crates/akio-webrtc", version = "=1.0.0-rc.1" }
akio = { path = "crates/akio", version = "=1.0.0-rc.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
# 1.0 API conventions (docs/api-stability.md): every public type is `Debug`.
missing_debug_implementations = "warn"

# Clippy: the default groups plus a curated set of pedantic / nursery / restriction lints that
# catch real mistakes or keep the code uniform without much noise. `unwrap_used` is enabled
# per library crate (`#![warn(clippy::unwrap_used)]` in each lib.rs) so tests and examples
# can keep using `unwrap()`; see clippy.toml for `allow-unwrap-in-tests`.
[workspace.lints.clippy]
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment, every `unsafe fn` a
# `# Safety` section (docs/unsafe-review.md).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# 1.0 API conventions: builder methods returning `Self` are `#[must_use]`.
return_self_not_must_use = "warn"
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
fn_to_numeric_cast_any = "warn"
lossy_float_literal = "warn"
# pedantic
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
mut_mut = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
range_plus_one = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
transmute_ptr_to_ptr = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
zero_sized_map_values = "warn"
# nursery
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
