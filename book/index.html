<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flash docs</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #222; --link: #0b5fbd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1f21; --fg: #ddd; --link: #6ab0f3; } }
  body { background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif;
         max-width: 40rem; margin: 4rem auto; padding: 0 16px; }
  a { color: var(--link); }
</style>
<script>
  // Send visitors to the book in their language; the links below work without JavaScript.
  var zh = (navigator.language || "").toLowerCase().indexOf("zh") === 0;
  if (location.search.indexOf("stay") < 0) location.replace(zh ? "zh-CN/" : "en/");
</script>
</head>
<body>
<h1>flash</h1>
<p><a href="en/">The flash Book (English)</a></p>
<p><a href="zh-CN/">flash 指南（简体中文）</a></p>
</body>
</html>
