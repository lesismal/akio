[book]
title = "akio — a network library for Rust"
description = "akio: an event-driven, thread-per-core network library for Rust"
authors = ["akio contributors"]
language = "en"
src = "src"

[build]
# Both languages build under target/book/ (git-ignored); see book/README.md.
build-dir = "../../target/book/en"
create-missing = false

[output.html]
git-repository-url = "https://github.com/lesismal/akio"
edit-url-template = "https://github.com/lesismal/akio/edit/main/book/en/{path}"
site-url = "/akio/en/"
additional-js = ["mermaid-init.js", "lang-switch.js"]
# Shown for missing pages; the site-wide 404.html is the English one (book/site.sh).
input-404 = "404.md"

[output.html.playground]
runnable = false

[output.html.search]
enable = true
