[book]
title = "The flash Book"
description = "flash: an event-driven, thread-per-core network library for Rust"
authors = ["The flash authors"]
language = "en"
src = "src"

[build]
# Both languages build under target/book/ (git-ignored); see book/README.md.
build-dir = "../../target/book/en"
create-missing = false

[output.html]
git-repository-url = "https://github.com/lesismal/flash"
edit-url-template = "https://github.com/lesismal/flash/edit/main/book/en/{path}"
site-url = "/flash/en/"
additional-js = ["mermaid-init.js"]

[output.html.playground]
runnable = false

[output.html.search]
enable = true
